name: Deploy Interactive Architecture Diagram to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages Artifact
        run: |
          mkdir -p _site
          cp assets/architecture.html _site/index.html
          cp assets/architecture.json _site/architecture.json
          cp assets/architecture-diagram.png _site/architecture-diagram.png
          if [ -f assets/icon.png ]; then cp assets/icon.png _site/icon.png; fi
          if [ -f assets/logo.png ]; then cp assets/logo.png _site/logo.png; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
