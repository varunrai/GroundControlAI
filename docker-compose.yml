services:
  collector:
    build: .
    container_name: agent_activity_collector
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOME}/.claude:/data/claude-code:ro
      - ${HOME}/.kimi-code:/data/kimi:ro
      - ${HOME}/.gemini/antigravity-cli:/data/agy:ro
      - ${HOME}/.config/Claude:/data/claude-desktop:ro
      - ./db:/app/db
      - .:/app

  web:
    build: .
    container_name: agent_activity_web
    restart: unless-stopped
    command: uvicorn app:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./db:/app/db
      - .:/app
